# Saatlik (hafta sonu 6 saatte bir) Dukascopy'den son barlari ceker, bulut_veri/son.parquet'e yazar.
# Streamlit Cloud bu commit'i gorunce uygulamayi yeni veriyle yeniler.
name: Gunluk veri guncelleme

on:
  schedule:
    - cron: "10 * * * 1-5"      # hafta ici her saat, :10'da
    - cron: "10 */6 * * 0,6"    # hafta sonu 6 saatte bir (BTC 7/24)
  workflow_dispatch:        # elle de calistirilabilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/bulut_guncelle.py
      - name: Degisiklik varsa gonder
        run: |
          git config user.name "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          git add bulut_veri/son.parquet
          git diff --cached --quiet || (git commit -m "Gunluk veri guncellemesi" && git push)
